# 本地开发配置模板 —— 数据库口令等敏感项请放 application-local.yml 且不入库
server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/handcraft_order?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: root
    password: change-me
  sql:
    init:
      mode: never          # 建库请手动执行 sql/schema.sql

classifier:
  python-command: python   # Windows 环境; Linux/macOS 一般为 python3
  script-path: ../python/order_classifier.py   # 相对 java-backend/ 工作目录

# 安全: 接口层统一鉴权(RBAC) + BCrypt 密码加密 + 敏感字段脱敏见 SecurityConfig(待实现)